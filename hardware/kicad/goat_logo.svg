<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- Billy goat silhouette facing right; each shape is a filled polygon for silkscreen import.
       At ~7.5 mm wide one unit is ~0.075 mm, so keep features >= 3 units for silkscreen. -->
  <g fill="#000">
    <!-- body, stocky -->
    <path d="M18 38 Q20 28 34 29 L62 29 Q72 30 73 40 Q74 52 64 55 L28 56 Q17 55 17 46 Z"/>
    <!-- tail -->
    <path d="M20 35 L12 25 L16 23 L25 31 Z"/>
    <!-- legs with hooves -->
    <path d="M23 52 L29 52 L28 72 L30 75 L23 75 L23 72 Z"/>
    <path d="M32 52 L38 52 L37 72 L39 75 L32 75 L32 72 Z"/>
    <path d="M56 52 L62 52 L61 72 L63 75 L56 75 L56 72 Z"/>
    <path d="M65 50 L71 47 L70 72 L72 75 L65 75 L65 72 Z"/>
    <!-- thick neck -->
    <path d="M58 32 L72 14 L82 18 L74 46 L66 48 Z"/>
    <!-- head and snout -->
    <path d="M72 13 Q78 8 84 11 L94 21 Q97 26 92 28 L85 27 Q77 25 72 20 Z"/>
    <!-- big horn sweeping back, tapering to a point -->
    <path d="M80 11 C72 -4 48 -6 42 15 C50 2 66 4 74 14 Z"/>
    <!-- ear -->
    <path d="M74 19 L62 22 L65 25 L75 22 Z"/>
    <!-- long pointed beard -->
    <path d="M81 25 L92 26 L87 46 Z"/>
  </g>
</svg>
