; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = yd_esp32_23

[env:yd_esp32_23]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/partitions_16MB_psram.csv
board_build.extra_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
monitor_speed = 115200
; Plug into the board's UART USB-C connector, then set your port:
;upload_port = COM3
;monitor_port = COM3
;test_port = COM3
lib_deps =
	throwtheswitch/Unity@^2.6.1
	olikraus/U8g2@^2.35.30

; Host-side logic tests (needs a C/C++ compiler on PATH): pio test -e native
[env:native]
platform = native
build_flags = -DNATIVE -std=gnu++11
